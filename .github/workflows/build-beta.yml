name: Build beta packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1
      - run: python -m pip install --only-binary=:all: -r requirements.txt pyinstaller
      - name: Focused regression tests
        env:
          PYTHONPATH: tests
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest test_first_run test_beta test_platform_support test_languages_updates test_driver_profile test_thumbnails test_print_frame
      - name: Windows portable and installer
        if: runner.os == 'Windows'
        run: |
          python build_windows.py
          python build_installer.py
      - name: Linux or macOS package
        if: runner.os != 'Windows'
        run: python build_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: GasketFit-beta-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-Setup.exe
            dist/checksums.json
          if-no-files-found: error
